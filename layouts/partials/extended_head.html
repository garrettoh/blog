<style id="writeup-workspace-styles">
  .writeup-workspace { display: grid; gap: 1.5rem; grid-template-columns: 245px minmax(0, 1fr); margin: 2rem 0; }
  .writeup-sidebar { align-self: start; background: #3B4252; border: 1px solid #4C566A; font-family: 'Fira Code', monospace; position: sticky; top: 1rem; }
  .writeup-home-link, .writeup-root-link { display: block; text-decoration: none; }
  .writeup-home-link { border-bottom: 1px solid #4C566A; color: #D8DEE9; font-size: .78rem; padding: .75rem .9rem; }
  .writeup-home-link:hover { color: #88C0D0; }
  .writeup-root-link { color: #88C0D0; font-weight: bold; letter-spacing: .08em; padding: .9rem; }
  .writeup-tree { border-top: 1px solid #4C566A; padding: .45rem 0; }
  .writeup-tree-group + .writeup-tree-group { border-top: 1px solid #4C566A; margin-top: .45rem; padding-top: .45rem; }
  .writeup-tree-heading { color: #EBCB8B; display: flex; font-size: .78rem; justify-content: space-between; padding: .55rem .9rem; text-decoration: none; }
  .writeup-tree-heading:hover { color: #88C0D0; }
  .writeup-tree-heading span { color: #A3BE8C; font-size: .68rem; }
  .writeup-tree ul { list-style: none; margin: 0; padding: 0 0 .4rem; }
  .writeup-tree li a { color: #D8DEE9; display: block; font-size: .76rem; line-height: 1.35; padding: .3rem .9rem .3rem 1.55rem; text-decoration: none; }
  .writeup-tree li a:hover, .writeup-tree li a.is-active { background: #434C5E; color: #88C0D0; }
  .writeup-tree li a.is-active { border-left: 3px solid #88C0D0; padding-left: calc(1.55rem - 3px); }
  .writeup-reader { min-width: 0; }
  .writeup-reader-header { border-bottom: 1px solid #4C566A; margin-bottom: 1.5rem; padding-bottom: 1rem; }
  .writeup-breadcrumb { color: #81A1C1; font-family: 'Fira Code', monospace; font-size: .78rem; margin: 0 0 .6rem; }
  .writeup-reader-title-row { align-items: flex-start; display: flex; gap: 1rem; justify-content: space-between; }
  .writeup-reader-title-row h1 { margin: 0; }
  .writeup-status { border: 1px solid #A3BE8C; color: #A3BE8C; display: inline-block; font-family: 'Fira Code', monospace; font-size: .72rem; letter-spacing: .03em; padding: .2rem .45rem; text-transform: uppercase; white-space: nowrap; }
  .writeup-reader-overview { color: #D8DEE9; line-height: 1.55; margin: .6rem 0 0; }
  .writeup-reader-eta { color: #A3BE8C; font-family: 'Fira Code', monospace; font-size: .82rem; margin: .8rem 0 0; }
  .writeup-reader-content { line-height: 1.65; max-width: 850px; }
  .writeup-reader-content img { border: 1px solid #4C566A; display: block; height: auto; margin: 1.25rem 0; max-width: 100%; }
  @media (max-width: 760px) { .writeup-workspace { display: block; } .writeup-sidebar { margin-bottom: 1.5rem; position: static; } }
  @media (min-width: 761px) {
    .writeup-sidebar { bottom: 0; left: 0; overflow-y: auto; position: fixed; top: 0; width: 260px; z-index: 20; }
    .writeup-workspace { display: block; margin: 2.5rem 0 3rem calc(300px - 50vw + 50%); width: min(1100px, calc(100vw - 350px)); }
    .writeup-reader-content { font-size: 1.08rem; max-width: 980px; }
    .writeup-reader-content h2 { font-size: 1.5rem; margin-top: 2.1rem; }
    .writeup-tree li a { font-size: .88rem; padding-bottom: .42rem; padding-top: .42rem; }
    .writeup-tree-heading { font-size: .9rem; }
  }
</style>
